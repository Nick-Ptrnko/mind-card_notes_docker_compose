services:
  mind_card_db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # З наявним томом ігнорується, але потрібне для healthcheck
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Лише для запуску pytest з хоста
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Kyiv}
    depends_on:
      mind_card_db:
        condition: service_healthy
    ports:
      # Хост:80 -> контейнер:8000
      - "${APP_BIND_IP:-10.0.0.1}:80:8000"
    volumes:
      - ./data:/app/data

volumes:
  mysql_data:
    external: true
