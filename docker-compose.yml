name: mind_card_notes

services:
  mind_card_db:
    image: mysql:9.7
    container_name: mind_card_db
    restart: unless-stopped
    environment:
      # Used only on the first start, when the volume is empty.
      # DB_ROOT_PASSWORD - the healthcheck uses it
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # One-time scripts (test database). Run only when the volume is empty; ignored otherwise.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Only for running pytest from the host
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    # Continues the existing image line: nickptrnko/mind-card_notes:1.2, 1.3, ...
    image: nickptrnko/mind-card_notes:${APP_VERSION:-1.4}
    build:
      context: .
      tags:
        - nickptrnko/mind-card_notes:latest
    container_name: mind_card_app
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-mind_card_db}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Kyiv}
    depends_on:
      mind_card_db:
        condition: service_healthy
    ports:
      # Host:80 -> container:8000
      - "${APP_BIND_IP:-10.0.0.1}:80:8000"
    volumes:
      - ./data:/app/data

volumes:
  # --- Variant A (default): the volume does NOT exist yet. Compose creates it on the first start. ---
  db_data:
    name: mysql97_data

  # --- Variant B: the volume ALREADY exists (it must hold MySQL 9.7 data).
  # Comment out variant A above, uncomment the three lines below.
  # If your volume has another name, change "name". Compose never creates or removes it.
  # db_data:
  #   external: true
  #   name: mysql97_data
